<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeuralDerm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="logo">NeuralDerm</div>

    <div class="menu">
        <a href="{{ url_for('home') }}" 
        class="{% if request.endpoint == 'home' %}active{% endif %}">Home</a>

        <a href="{{ url_for('history') }}" 
        class="{% if request.endpoint == 'history' %}active{% endif %}">History</a>

        <a href="{{ url_for('about') }}" 
        class="{% if request.endpoint == 'about' %}active{% endif %}">About</a>
    </div>


    <a href="{{ url_for('scan') }}" class="scan-btn">Scan here</a>
</nav>

{% block content %}{% endblock %}

</body>
</html>
